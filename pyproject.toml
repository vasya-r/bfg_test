[project]
name = "warehouse"
version = "0.1.0"
description = "inventory API + analytics worker with redis pub/sub"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.32",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.0,<3",
    "redis>=5.0,<9",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "black>=24,<27",
    "build>=1,<2",
    "isort>=5.13,<10",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]


[project.scripts]
inventory-api = "warehouse.inventory_api.bin.run:main"
analytics-worker = "warehouse.analytics_worker.bin.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse"]

[tool.hatch.build.targets.sdist]
include = ["/src"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.isort]
profile = "black"
line_length = 100
src_paths = [
    "src",
    "tests",
]


[tool.black]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
