services:
  postgres:
    image: postgres:16-alpine
    container_name: bfg_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - bfg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis: &redis
    image: redis:7-alpine
    container_name: bfg_redis
    command: sh -c 'exec docker-entrypoint.sh redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis_test:
    <<: *redis
    container_name: bfg_redis_test
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-6381}:6379"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  bfg_pgdata:
    name: bfg_pgdata
